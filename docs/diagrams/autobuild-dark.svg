<text x="206" y="320" fill="#C4BFB8" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">merge</text>
<rect x="262" y="310" width="24" height="12" rx="3" fill="#e8e5e1" stroke="#C4BFB8" stroke-width="1" fill-opacity="0.05"/>
<text x="294" y="320" fill="#C4BFB8" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">precondition</text>
