<svg viewBox="0 0 960 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="autobuild-dark-title autobuild-dark-desc" id="autobuild-dark-root">
<title id="autobuild-dark-title">autobuild: the hands-off feature loop</title>
<desc id="autobuild-dark-desc">Ten-step loop from preconditions through scouting, parallel builds, one-PR-at-a-time review and merge, live verification and the log.</desc>
<defs>
      <style>#autobuild-dark-root { --color-paper: #1C1B19; --color-ink: #E8E5E1; --color-muted: #C4BFB8; }
      #autobuild-dark-root { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif; color: var(--color-ink); }
      #autobuild-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#autobuild-dark-root .diagram-container { overflow-x: visible; }
}</style><marker id="autobuild-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#C4BFB8"/></marker><marker id="autobuild-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#D06A4C"/></marker><marker id="autobuild-dark-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6B8B9E"/></marker></defs>
