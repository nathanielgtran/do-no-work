<path d="M478,240 V264 Q478,272 486,272 H854 Q862,272 862,264 V240" fill="none" stroke="#C4BFB8" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#autobuild-dark-arrow)"/>
<rect x="632" y="254" width="76" height="12" rx="2" fill="#1C1B19"/><text x="670" y="263" fill="#9A9590" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NEXT: REBASE</text>
<rect x="20" y="24" width="148" height="76" rx="6" fill="#1C1B19"/>
<rect x="20" y="24" width="148" height="76" rx="6" fill="#e8e5e1" stroke="#C4BFB8" stroke-width="1" fill-opacity="0.05"/>
<text x="30" y="40" fill="#9A9590" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="0.1em">01</text>
<text x="94" y="58" fill="#E8E5E1" font-size="12" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" text-anchor="middle">Preconditions</text>
<text x="94" y="74" fill="#C4BFB8" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">openspec/config.yaml</text>
<text x="94" y="86" fill="#C4BFB8" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">dial is not 'go less'</text>
<rect x="212" y="24" width="148" height="76" rx="6" fill="#1C1B19"/>
<rect x="212" y="24" width="148" height="76" rx="6" fill="#242320" stroke="#E8E5E1" stroke-width="1"/>
<text x="222" y="40" fill="#9A9590" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="0.1em">02</text>
<text x="286" y="58" fill="#E8E5E1" font-size="12" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" text-anchor="middle">Scout</text>
<text x="286" y="74" fill="#C4BFB8" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">hand-done steps first</text>
<text x="286" y="86" fill="#C4BFB8" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">then gaps, issues, TODO</text>
<rect x="404" y="24" width="148" height="76" rx="6" fill="#1C1B19"/>
<rect x="404" y="24" width="148" height="76" rx="6" fill="#242320" stroke="#E8E5E1" stroke-width="1"/>
<text x="414" y="40" fill="#9A9590" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="0.1em">03</text>
<text x="478" y="58" fill="#E8E5E1" font-size="12" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" text-anchor="middle">Pick up to 3</text>
<text x="478" y="74" fill="#C4BFB8" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">independent features</text>
<text x="478" y="86" fill="#C4BFB8" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">one line each, then go</text>
<rect x="596" y="24" width="148" height="76" rx="6" fill="#1C1B19"/>
<rect x="596" y="24" width="148" height="76" rx="6" fill="#242320" stroke="#E8E5E1" stroke-width="1"/>
<text x="606" y="40" fill="#9A9590" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="0.1em">04</text>
<text x="670" y="58" fill="#E8E5E1" font-size="12" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" text-anchor="middle">Set up</text>
<text x="670" y="74" fill="#C4BFB8" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">worktrees off main</text>
<text x="670" y="86" fill="#C4BFB8" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">assign CHANGELOG IDs</text>
<rect x="788" y="24" width="148" height="76" rx="6" fill="#1C1B19"/>
<rect x="788" y="24" width="148" height="76" rx="6" fill="#242320" stroke="#E8E5E1" stroke-width="1"/>
<text x="798" y="40" fill="#9A9590" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="0.1em">05</text>
<text x="862" y="58" fill="#E8E5E1" font-size="12" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" text-anchor="middle">Build x3</text>
<text x="862" y="74" fill="#C4BFB8" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">parallel agents</text>
<text x="862" y="86" fill="#C4BFB8" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">spec, TDD, PR; no merge</text>
<rect x="788" y="164" width="148" height="76" rx="6" fill="#1C1B19"/>
<rect x="788" y="164" width="148" height="76" rx="6" fill="#242320" stroke="#E8E5E1" stroke-width="1"/>
<text x="798" y="180" fill="#9A9590" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="0.1em">06</text>
<text x="862" y="198" fill="#E8E5E1" font-size="12" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" text-anchor="middle">Review PR</text>
<text x="862" y="214" fill="#C4BFB8" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">orchestrator reads diff</text>
<text x="862" y="226" fill="#C4BFB8" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">smallest blast first</text>
<rect x="596" y="164" width="148" height="76" rx="6" fill="#1C1B19"/>
<rect x="596" y="164" width="148" height="76" rx="6" fill="#242320" stroke="#E8E5E1" stroke-width="1"/>
<text x="606" y="180" fill="#9A9590" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="0.1em">07</text>
<text x="670" y="198" fill="#E8E5E1" font-size="12" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" text-anchor="middle">Wait for CI</text>
<text x="670" y="214" fill="#C4BFB8" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">watch checks</text>
<text x="670" y="226" fill="#C4BFB8" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">red means fix</text>
<rect x="404" y="164" width="148" height="76" rx="6" fill="#1C1B19"/>
<rect x="404" y="164" width="148" height="76" rx="6" fill="#d06a4c" stroke="#D06A4C" stroke-width="1" fill-opacity="0.14"/>
<text x="414" y="180" fill="#9A9590" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="0.1em">08</text>
<text x="478" y="198" fill="#E8E5E1" font-size="12" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" text-anchor="middle">Label, then merge</text>
<text x="478" y="214" fill="#C4BFB8" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">REVIEWED, then squash</text>
<text x="478" y="226" fill="#C4BFB8" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">separate calls</text>
<rect x="212" y="164" width="148" height="76" rx="6" fill="#1C1B19"/>
<rect x="212" y="164" width="148" height="76" rx="6" fill="#242320" stroke="#E8E5E1" stroke-width="1"/>
<text x="222" y="180" fill="#9A9590" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="0.1em">09</text>
<text x="286" y="198" fill="#E8E5E1" font-size="12" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" text-anchor="middle">Verify live</text>
<text x="286" y="214" fill="#C4BFB8" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">read-only, real data</text>
<text x="286" y="226" fill="#C4BFB8" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">surprises go in report</text>
<rect x="20" y="164" width="148" height="76" rx="6" fill="#1C1B19"/>
<rect x="20" y="164" width="148" height="76" rx="6" fill="#242320" stroke="#E8E5E1" stroke-width="1"/>
<text x="30" y="180" fill="#9A9590" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="0.1em">10</text>
<text x="94" y="198" fill="#E8E5E1" font-size="12" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" text-anchor="middle">Log + report</text>
<text x="94" y="214" fill="#C4BFB8" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">daily log, memory</text>
<text x="94" y="226" fill="#C4BFB8" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">one next step</text>
<text x="20" y="268" fill="#C4BFB8" font-size="14" font-style="italic" font-family="ui-serif, Georgia, 'Times New Roman', serif" text-anchor="start">You merge one PR at a time.</text>
<text x="20" y="286" fill="#C4BFB8" font-size="14" font-style="italic" font-family="ui-serif, Georgia, 'Times New Roman', serif" text-anchor="start">A rejected tool call stops the loop.</text>
