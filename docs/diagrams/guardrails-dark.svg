<title id="guardrails-dark-title">Guardrails: how a Bash call is decided</title>
<desc id="guardrails-dark-desc">Decision flow for a Bash command through autonomy-gate, gate-self-merge and openspec-autonomy, with settings deny rules always winning.</desc>
