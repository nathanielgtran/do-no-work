<text x="286" y="350" fill="#C4BFB8" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">dial write, push main</text>
<text x="286" y="362" fill="#C4BFB8" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">--no-verify, less push</text>
