<text x="602" y="198" fill="#2C2C2A" font-size="12" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" text-anchor="middle">CI + Claude review</text>
<text x="602" y="214" fill="#5C5650" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">ci.yml, claude-review.yml</text>
