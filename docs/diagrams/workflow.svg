<text x="114" y="338" fill="#2C2C2A" font-size="12" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" text-anchor="middle">Release / deploy</text>
<text x="114" y="354" fill="#5C5650" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">where the repo allows it</text>
