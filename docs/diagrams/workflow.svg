<svg viewBox="0 0 960 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="workflow-title workflow-desc" id="workflow-root">
<title id="workflow-title">The workflow: plan, isolate, prove, review, merge</title>
<desc id="workflow-desc">Ten steps from session start to /log, with the CI Claude review applying REVIEWED, the gate-self-merge hook checking it, and a fix loop on a blocked review.</desc>
