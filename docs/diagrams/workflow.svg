<text x="602" y="58" fill="#2C2C2A" font-size="12" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" text-anchor="middle">Worktree + branch</text>
<text x="602" y="74" fill="#5C5650" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">never the primary checkout</text>
