name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Shell syntax
        run: for f in install.sh tests/*.sh bin/* claude/hooks/*.sh; do head -1 "$f" | grep -q bash && bash -n "$f"; done
      - name: Hook decisions
        run: ./tests/hooks_test.sh
      - name: repo-bootstrap
        run: ./tests/bootstrap_test.sh
      - name: ci-wait
        run: ./tests/ci_wait_test.sh
      - name: Installer
        run: ./tests/install_test.sh
      - name: wanderlog
        working-directory: claude/skills/wanderlog
        run: python3 -m unittest -q test_wl
      - name: backlog
        working-directory: claude/skills/backlog
        run: uvx pytest -q test_generate.py -p no:cacheprovider
      - name: tighten
        if: runner.os == 'Linux'
        run: |
          bash claude/skills/tighten/tests/preflight_test.sh
          bash claude/skills/tighten/tests/tier_test.sh
      - name: Claude review verdict
        run: ./tests/claude_review_verdict_test.sh
      - name: Research hooks
        run: ./tests/research_hooks_test.sh
      - name: Public safety
        env:
          PUBLIC_SAFETY_DENY_LIST: ${{ secrets.PUBLIC_SAFETY_DENY_LIST }}
        run: |
          ./tests/public_safety_test.sh
          ./scripts/public-safety-check.sh
      - name: Changelog fragments
        run: |
          ./scripts/changelog.sh check
          ./tests/changelog_test.sh
      - name: Review rollout
        run: ./tests/review_test.sh
      - name: dnw-doctor
        run: ./tests/doctor_test.sh

  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install into throwaway home
        shell: pwsh
        run: |
          $h = Join-Path $env:RUNNER_TEMP 'winhome'
          New-Item -ItemType Directory -Force -Path $h | Out-Null
          "WIN_HOME=$h" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          $env:HOME = $h
          $env:USERPROFILE = $h
          $env:DOTFILES_SKIP_UPSTREAM = '1'
          $env:GIT_NAME = 'CI User'
          $env:GIT_EMAIL = 'ci@example.invalid'
          powershell -ExecutionPolicy Bypass -File .\install.ps1 -NoDeps
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 exited $LASTEXITCODE" }
      - name: Assert installed files
        shell: pwsh
        run: |
          foreach ($rel in '.claude\hooks\autonomy-gate.sh', '.local\bin\safe-worktree-remove') {
            $p = Join-Path $env:WIN_HOME $rel
            $item = Get-Item -LiteralPath $p -ErrorAction Stop
            if ($item.PSIsContainer -or $item.LinkType) { throw "$p is not a regular file" }
            Write-Host "ok $p"
          }

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
